[workspace]
name = "sciastro"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
requires-pixi = ">=0.72.2"

[dependencies]
nodejs = "24.*"
pnpm = "==11.19.0"

# Documentation is isolated from the JavaScript development environment.
[feature.docs.dependencies]
python = "3.12.*"
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.6,<10"

[feature.docs.tasks.docs-build]
cmd = "mkdocs build --strict"
description = "Build the documentation and check internal links"

[feature.docs.tasks.docs-serve]
cmd = "mkdocs serve --dev-addr 127.0.0.1:8000"
description = "Preview the documentation locally"

[environments]
default = { features = [] }
docs = { features = ["docs"], no-default-feature = true }

[tasks.setup]
cmd = "pnpm install --frozen-lockfile"
description = "Install dependencies using the lockfile"

[tasks.version-check]
cmd = "node scripts/version.mjs check"
description = "Check package/changelog versions and prevent hardcoded docs versions"

[tasks.version-set]
cmd = "node scripts/version.mjs set"
description = "Update the package version and start its changelog entry; pass the new version"

[tasks.build]
cmd = "pnpm build"
depends-on = ["setup"]
description = "Compile the SciAstro package"

[tasks.verify]
cmd = "pnpm verify"
depends-on = ["setup"]
description = "Check types, tests, examples and installed consumers"

[tasks.dev]
cmd = "pnpm dev"
depends-on = ["build"]
description = "Preview the research-group example"

[tasks.test]
cmd = "pnpm build && pnpm test"
depends-on = ["setup"]
description = "Compile and run content, bibliography and icon tests"

[tasks.browser-install]
cmd = "pnpm exec playwright install chromium"
depends-on = ["setup"]
description = "Install the browser used by automated tests"

[tasks.test-browser]
cmd = "pnpm test:browser"
depends-on = ["setup"]
description = "Build examples and test the interface in Chromium"

[tasks.verify-all]
cmd = "pnpm verify:all"
depends-on = ["setup"]
description = "Run all checks, including browser tests"

[tasks.dev-individual]
cmd = "pnpm dev:individual"
depends-on = ["build"]
description = "Preview the individual website example"

[tasks.dev-stop]
cmd = "pnpm --filter sciastro-example-group exec astro dev stop"
depends-on = ["setup"]
description = "Stop the group preview"

[tasks.dev-individual-stop]
cmd = "pnpm --filter sciastro-example-individual exec astro dev stop"
depends-on = ["setup"]
description = "Stop the individual preview"

[tasks.pack]
cmd = "pnpm pack --skip-manifest-obfuscation --pack-destination artifacts"
depends-on = ["setup"]
description = "Create an installable package without publishing to npm"

[tasks.dev-lncc]
cmd = "pnpm dev:lncc"
depends-on = ["build"]
description = "Preview the composed LNCC Theme example"

[tasks.dev-lncc-stop]
cmd = "pnpm --filter sciastro-example-lncc exec astro dev stop"
depends-on = ["setup"]
description = "Stop the LNCC Theme preview"
