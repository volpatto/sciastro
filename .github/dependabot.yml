version: 2
updates:
  # The root pnpm workspace includes the package and all example websites.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # Update pnpm together with its Pixi pin and lockfile, not in isolation.
    ignore:
      - dependency-name: pnpm
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci(deps)
    groups:
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
